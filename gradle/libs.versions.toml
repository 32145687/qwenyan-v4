[versions]

# --- Kotlin / 构建 ---
kotlin = "2.0.21"
agp = "8.7.3"
compileSdk = "34"
minSdk = "24"
targetSdk = "34"
jvmTarget = "17"

# --- 测试 ---
junitJupiter = "5.11.3"
kotlinx-coroutines = "1.9.0"
kotlinx-serialization = "1.7.3"
kotlinx-datetime = "0.6.1"

# --- Storage (TBD-4: SQLDelight 单 SQL) — P2 引入 ---
sqldelight = "2.0.2"

# --- 后续 Phase 引入（P0 暂不使用；见各 Phase 计划）---
koin = "4.0.0"
sqliteJdbc = "3.46.0.0"
mockk = "1.13.13"
androidx-core-ktx = "1.15.0"
compose = "1.7.5"

[libraries]

# --- 测试基础 ---
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

# --- 后续 Phase（占位版本，不在 P0 使用）---
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }

# --- Storage (SQLDelight) ---
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }

[plugins]

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }