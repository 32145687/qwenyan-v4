# See https://docs.gradle.org/8.14.5/userguide/gradle_properties.html
# 构建环境修复（P7.3）：沙箱为 cgroup v2 容器，JDK17.0.2 的 Container.metrics() 在
# CgroupV2Subsystem 上抛 NPE（AnyController is null），导致 AGP JvmWideVariable 静态初始化失败
# （validateSigningDebug 崩溃）。关闭容器资源探测后恢复。
org.gradle.jvmargs=-Xmx2g -XX:-UseContainerSupport -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 统一编码与测试日志
kotlin.code.style=official

# 固定构建 JVM 为 JDK 17（AGP 8 与 Gradle Kotlin DSL 的稳定基线；避免 JDK 25 解析问题）
org.gradle.java.home=/root/.local/share/mise/installs/java/17

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true